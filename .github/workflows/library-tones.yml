name: Rebuild the library, then cut the tones

on:
  push:
    paths:
      - '.lib-run/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the adhans (dropped and incomplete ones removed)
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          python3 tools/build_library.py
          git add -A audio adhans.json CREDITS.md build-report.txt
          git commit -m "Library rebuilt: incomplete adhans removed" || echo nothing
          git pull --rebase origin main && git push

  cut:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install tools
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install faster-whisper
      - name: Cut and verify the clips
        run: rm -f audio/alert_*.mp3 && python3 tools/make_alerts.py ${{ matrix.part }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ matrix.part }}
          path: |
            alerts-part-${{ matrix.part }}.json
            audio/alert_*.mp3
  merge:
    needs: cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/parts
      - name: Merge
        run: |
          for d in /tmp/parts/*/; do cp "$d"/alerts-part-*.json . 2>/dev/null || true; cp "$d"/audio/alert_*.mp3 audio/ 2>/dev/null || true; done
          python3 tools/make_alerts.py merge
          rm -f alerts-part-*.json
      - name: Commit results
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add audio adhans.json CREDITS.md alerts-report.txt
          git commit -m "Alert tones cut from the library recordings" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
