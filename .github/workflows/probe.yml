name: Probe data sources
on:
  push:
    paths: ['.probe/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p probe-out
          while read -r u; do
            [ -z "$u" ] && continue
            code=$(curl -sL -o /tmp/x -w '%{http_code} %{size_download} %{content_type}' --max-time 120 "$u")
            echo "$code $u" | tee -a probe-out/urls.txt
            cat /tmp/x | tr -d '\000' > "probe-out/$(echo "$u" | md5sum | cut -c1-8).head" || true
          done < .probe/urls.txt
          curl -sL -o probe-out/page003.png https://android.quran.com/data/width_1260/page003.png || true
          curl -sL -o probe-out/page050.png https://android.quran.com/data/width_1260/page050.png || true
          curl -sL -o /tmp/ai.zip https://android.quran.com/data/databases/ayahinfo/ayahinfo_1260.zip && cd /tmp && unzip -o -q ai.zip && ls -la /tmp | tee -a $GITHUB_WORKSPACE/probe-out/ayahinfo.txt && for f in /tmp/*.db; do sqlite3 "$f" ".schema" "select * from glyphs where page_number=3 limit 12;" >> $GITHUB_WORKSPACE/probe-out/ayahinfo.txt; done || true
      - name: Save
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe-out && git commit -m "Probe results" && git push || true
