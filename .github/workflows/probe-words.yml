name: Probe adhan endings
on:
  push:
    paths: ['.probe-words/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install faster-whisper
      - run: python3 tools/probe_words.py $(cat .probe-words/ids.txt)
      - run: |
          git config user.name build-bot; git config user.email build-bot@users.noreply.github.com
          git add probe-words.txt; git commit -m "Probe adhan endings" || true
          git pull --rebase origin main && git push
