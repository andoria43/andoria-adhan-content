name: Trim the adhans (no talk before or after), then cut the tones again

on:
  push:
    paths:
      - '.trim-run/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install faster-whisper
      - name: Trim
        run: python3 tools/talk_trim.py ${{ matrix.part }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: trim-${{ matrix.part }}
          path: |
            trim-part-${{ matrix.part }}.json
            trimmed/*.mp3
  merge-trim:
    needs: trim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/parts
      - name: Merge and commit
        run: |
          mkdir -p trimmed
          for d in /tmp/parts/*/; do cp "$d"/trim-part-*.json . 2>/dev/null || true; cp "$d"/trimmed/*.mp3 trimmed/ 2>/dev/null || true; done
          python3 tools/talk_trim.py merge
          rm -rf trim-part-*.json trimmed
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A audio adhans.json trim-report.txt
          git commit -m "Adhans trimmed: nothing said before or after the adhan" || echo nothing
          git pull --rebase origin main && git push
  cut:
    needs: merge-trim
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install tools
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install faster-whisper
      - name: Cut and verify the clips
        run: rm -f audio/alert_*.mp3 && python3 tools/make_alerts.py ${{ matrix.part }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ matrix.part }}
          path: |
            alerts-part-${{ matrix.part }}.json
            audio/alert_*.mp3
  merge-alerts:
    needs: cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/parts
          pattern: alerts-*
      - name: Merge
        run: |
          for d in /tmp/parts/*/; do cp "$d"/alerts-part-*.json . 2>/dev/null || true; done
          if ls alerts-part-*.json >/dev/null 2>&1; then
            rm -f audio/alert_*.mp3
            for d in /tmp/parts/*/; do cp "$d"/audio/alert_*.mp3 audio/ 2>/dev/null || true; done
          fi
          python3 tools/make_alerts.py merge
          rm -f alerts-part-*.json
      - name: Commit results
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A audio adhans.json CREDITS.md alerts-report.txt
          git commit -m "Alert tones cut again, edges checked" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
