name: Freesound adhans check
on:
  push:
    paths: ['.freesound-probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install faster-whisper
      - run: timeout 33m python3 tools/freesound_probe.py || true
        env: {SHARD: "${{ matrix.shard }}", SHARDS: "6"}
      - if: always()
        run: |
          git config user.name build-bot; git config user.email build-bot@users.noreply.github.com
          git add freesound-report-*.json freesound_raw; git commit -m "Freesound adhans: part ${{ matrix.shard }}" || true
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 20 + 5)); done
