name: Build muezzin library

on:
  push:
    paths:
      - 'sources.json'
      - 'tools/build_library.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Build
        run: python3 tools/build_library.py
      - name: Commit results
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add audio adhans.json CREDITS.md build-report.txt
          git commit -m "Library built from sources.json" || echo "nothing to commit"
          git push
